<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>N5 Japanese Master — Offline JLPT N5 Study App</title>
  <style>
    :root {
      --bg:#f7f4ef; --panel:#fffdf8; --ink:#22223b; --muted:#5f6072; --line:#e7ded0;
      --accent:#d94f3d; --accent2:#245b75; --accent3:#2b8a6e; --soft:#fff1eb; --soft2:#eaf5f7;
      --shadow:0 14px 40px rgba(49,35,20,.12); --radius:22px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --jp:"Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:radial-gradient(circle at top left,#fff4e8,transparent 32rem),linear-gradient(135deg,#f7f4ef,#eef6f5); color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { cursor:pointer; }
    .app { display:grid; grid-template-columns:300px 1fr; min-height:100vh; }
    aside { position:sticky; top:0; height:100vh; padding:22px; border-right:1px solid var(--line); background:rgba(255,253,248,.86); backdrop-filter: blur(18px); overflow:auto; }
    main { padding:28px; max-width:1320px; width:100%; margin:0 auto; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .logo { width:46px; height:46px; border-radius:16px; background:linear-gradient(135deg,var(--accent),#ffb27d); display:grid; place-items:center; color:white; font-weight:900; box-shadow:var(--shadow); }
    .brand h1 { font-size:1.05rem; margin:0; line-height:1.1; }
    .brand small { color:var(--muted); display:block; margin-top:3px; }
    .nav { display:grid; gap:8px; margin:18px 0; }
    .nav button { border:0; text-align:left; padding:12px 13px; border-radius:14px; background:transparent; color:var(--ink); display:flex; gap:10px; align-items:center; }
    .nav button.active,.nav button:hover { background:var(--soft); color:#8f261c; }
    .side-card { background:linear-gradient(180deg,#fff,#fff8ef); border:1px solid var(--line); border-radius:18px; padding:14px; margin:14px 0; box-shadow:0 8px 24px rgba(60,40,20,.06); }
    .meter { height:10px; border-radius:999px; background:#eadfd2; overflow:hidden; }
    .meter span { display:block; height:100%; background:linear-gradient(90deg,var(--accent),#f5a557); width:0%; transition:.35s; }
    .tiny { font-size:.78rem; color:var(--muted); }
    .hero { display:grid; grid-template-columns:1.35fr .8fr; gap:22px; align-items:stretch; }
    .card { background:rgba(255,253,248,.9); border:1px solid var(--line); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); }
    .hero .card:first-child { background:linear-gradient(135deg,#fffdf8 0%,#fff0e6 100%); }
    h2 { margin:0 0 12px; font-size:clamp(1.55rem,3vw,2.55rem); line-height:1.05; letter-spacing:-.04em; }
    h3 { margin:0 0 12px; font-size:1.18rem; }
    h4 { margin:0 0 8px; }
    p { line-height:1.65; }
    .subtitle { color:var(--muted); max-width:74ch; }
    .pillrow { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
    .pill { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:7px 10px; background:#fff; color:#4d4e61; font-size:.88rem; }
    .grid { display:grid; gap:16px; }
    .grid.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .grid.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .stat { padding:16px; border-radius:18px; background:#fff; border:1px solid var(--line); }
    .stat b { font-size:1.7rem; display:block; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:14px 0 18px; }
    .toolbar input,.toolbar select, textarea { border:1px solid var(--line); background:#fff; padding:11px 12px; border-radius:13px; min-height:42px; }
    .toolbar input { min-width:240px; }
    .btn { border:0; border-radius:14px; padding:11px 14px; background:var(--ink); color:white; box-shadow:0 8px 20px rgba(34,34,59,.15); }
    .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); box-shadow:none; }
    .btn.accent { background:var(--accent); }
    .btn.good { background:var(--accent3); }
    .btn.warn { background:#9c6a19; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .jp { font-family:var(--jp); }
    .bigjp { font-family:var(--jp); font-size:2.4rem; line-height:1.1; }
    .mega { font-family:var(--jp); font-size:6rem; line-height:1; }
    .kana-grid { display:grid; grid-template-columns:repeat(5, minmax(48px,1fr)); gap:8px; margin-bottom:14px; }
    .kana-cell { min-height:64px; border:1px solid var(--line); border-radius:13px; background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:2px; font-family:var(--jp); font-size:1.6rem; transition:.15s; }
    .kana-cell small { font-family:var(--mono); color:var(--muted); font-size:.7rem; }
    .kana-cell.blank { background:rgba(255,255,255,.45); border-style:dashed; cursor:default; }
    .kana-cell:not(.blank):hover { transform:translateY(-2px); border-color:#d8a68e; background:var(--soft); }
    .kana-practice-card { min-height:220px; }
    .kana-prompt-romaji { font-family:var(--mono); font-size:1.15rem; color:var(--muted); margin:8px 0 0; }
    .kana-hidden-target { color:var(--muted); opacity:.72; }
    .audio-status { min-height:22px; margin:-2px 0 12px; color:var(--muted); }
    .audio-panel { display:grid; gap:8px; margin:10px 0 16px; padding:12px; border:1px solid var(--line); border-radius:16px; background:#fff; }
    .audio-panel .toolbar { margin:0; }
    .audio-status.danger { color:#9b1c1c; }
    .audio-status.good { color:#176044; }
    .audio-help { color:var(--muted); font-size:.82rem; line-height:1.45; }
    .voice-select { min-width:260px; max-width:100%; }

    .writing-lab .toolbar { margin-top:0; }
    .list { display:grid; gap:10px; }
    .row { display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; border:1px solid var(--line); background:#fff; padding:13px; border-radius:16px; }
    .row small { color:var(--muted); }
    .tag { background:var(--soft2); color:#205162; padding:4px 8px; border-radius:999px; font-size:.76rem; border:1px solid #d6e9ed; }
    .tag.core { background:#fff0e6; color:#8f261c; border-color:#f2d4c5; }
    .flashcard { min-height:300px; display:grid; place-items:center; text-align:center; position:relative; overflow:hidden; }
    .flashcard::after { content:""; position:absolute; inset:auto -40px -70px auto; width:220px; height:220px; background:rgba(217,79,61,.1); border-radius:50%; }
    .flash-inner { position:relative; z-index:1; }
    .answer { margin-top:14px; padding:14px; border-radius:18px; background:#fff; border:1px dashed #d1b9a4; }
    .choices { display:grid; gap:10px; margin-top:16px; }
    .choice { border:1px solid var(--line); background:#fff; padding:14px; border-radius:15px; text-align:left; }
    .choice.correct { border-color:#71b695; background:#edfff5; }
    .choice.wrong { border-color:#e08376; background:#fff0ee; }
    .grammar-card { border:1px solid var(--line); border-radius:18px; padding:16px; background:#fff; }
    .grammar-card .pattern { font-family:var(--jp); font-size:1.25rem; background:#f8f1e8; border-radius:12px; padding:9px 10px; display:inline-block; }
    .example { border-left:4px solid #efd2c3; padding:8px 0 8px 12px; margin:8px 0; }
    details { border:1px solid var(--line); border-radius:16px; padding:12px 14px; background:#fff; }
    summary { cursor:pointer; font-weight:700; }
    table { width:100%; border-collapse:separate; border-spacing:0; overflow:hidden; border-radius:16px; }
    th,td { text-align:left; border-bottom:1px solid var(--line); padding:11px; background:#fff; vertical-align:top; }
    th { background:#faf2e9; font-size:.86rem; color:#5a4b42; }
    tr:last-child td { border-bottom:0; }
    .canvasWrap { background:#fff; border:1px solid var(--line); border-radius:20px; padding:12px; }
    canvas { width:100%; height:460px; border-radius:16px; background:#fff; touch-action:none; display:block; }
    .hidden { display:none !important; }
    .notice { border:1px solid #efd1a5; background:#fff8e8; color:#5f4320; padding:13px 14px; border-radius:16px; }
    .danger { border-color:#f0c3be; background:#fff1ef; color:#743129; }
    .reading-box { border:1px solid var(--line); border-radius:18px; padding:18px; background:#fff; }
    .reading-box .jp { font-size:1.2rem; line-height:2; }
    .footer { margin:30px 0 0; color:var(--muted); font-size:.86rem; }
    .mobile-toggle { display:none; position:fixed; right:16px; bottom:16px; z-index:30; border:0; background:var(--accent); color:#fff; border-radius:999px; padding:12px 16px; box-shadow:var(--shadow); }
    @media (max-width: 980px) {
      .app { grid-template-columns:1fr; } aside { position:fixed; z-index:20; transform:translateX(-105%); transition:.25s; width:min(86vw,330px); box-shadow:var(--shadow); } aside.open { transform:translateX(0); } main { padding:18px; } .mobile-toggle { display:block; } .hero,.grid.two,.grid.three,.grid.four { grid-template-columns:1fr; } .toolbar input { min-width:0; width:100%; }
    }
    @media print { aside,.mobile-toggle,.toolbar .btn,.nav { display:none!important; } .app { display:block; } main { padding:0; } .card { box-shadow:none; break-inside:avoid; } body { background:#fff; } }
  </style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><div class="logo">N5</div><div><h1>N5 Japanese Master</h1><small>Offline study + practice app</small></div></div>
    <div class="side-card">
      <div class="tiny">Overall progress</div>
      <div class="meter" aria-label="progress"><span id="progressBar"></span></div>
      <p class="tiny" id="progressText">0 mastered items</p>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-card">
      <b>Daily loop</b>
      <p class="tiny">Kana/kanji 10m → vocab 15m → grammar 20m → listening/shadowing 10m → quiz 10m.</p>
      <button class="btn secondary" onclick="exportProgress()">Export progress</button>
    </div>
  </aside>
  <main id="app"></main>
</div>
<button class="mobile-toggle" onclick="document.getElementById('side').classList.toggle('open')">Menu</button>
<script>
const DATA = {"kana": {"hiragana": [["あ", "い", "う", "え", "お"], ["か", "き", "く", "け", "こ"], ["さ", "し", "す", "せ", "そ"], ["た", "ち", "つ", "て", "と"], ["な", "に", "ぬ", "ね", "の"], ["は", "ひ", "ふ", "へ", "ほ"], ["ま", "み", "む", "め", "も"], ["や", "", "ゆ", "", "よ"], ["ら", "り", "る", "れ", "ろ"], ["わ", "", "", "", "を"], ["ん", "", "", "", ""]], "katakana": [["ア", "イ", "ウ", "エ", "オ"], ["カ", "キ", "ク", "ケ", "コ"], ["サ", "シ", "ス", "セ", "ソ"], ["タ", "チ", "ツ", "テ", "ト"], ["ナ", "ニ", "ヌ", "ネ", "ノ"], ["ハ", "ヒ", "フ", "ヘ", "ホ"], ["マ", "ミ", "ム", "メ", "モ"], ["ヤ", "", "ユ", "", "ヨ"], ["ラ", "リ", "ル", "レ", "ロ"], ["ワ", "", "", "", "ヲ"], ["ン", "", "", "", ""]], "dakuten": [["が", "ぎ", "ぐ", "げ", "ご"], ["ざ", "じ", "ず", "ぜ", "ぞ"], ["だ", "ぢ", "づ", "で", "ど"], ["ば", "び", "ぶ", "べ", "ぼ"], ["ぱ", "ぴ", "ぷ", "ぺ", "ぽ"], ["ガ", "ギ", "グ", "ゲ", "ゴ"], ["ザ", "ジ", "ズ", "ゼ", "ゾ"], ["ダ", "ヂ", "ヅ", "デ", "ド"], ["バ", "ビ", "ブ", "ベ", "ボ"], ["パ", "ピ", "プ", "ペ", "ポ"]], "yoon": [["きゃ", "きゅ", "きょ"], ["しゃ", "しゅ", "しょ"], ["ちゃ", "ちゅ", "ちょ"], ["にゃ", "にゅ", "にょ"], ["ひゃ", "ひゅ", "ひょ"], ["みゃ", "みゅ", "みょ"], ["りゃ", "りゅ", "りょ"], ["ぎゃ", "ぎゅ", "ぎょ"], ["じゃ", "じゅ", "じょ"], ["びゃ", "びゅ", "びょ"], ["ぴゃ", "ぴゅ", "ぴょ"], ["キャ", "キュ", "キョ"], ["シャ", "シュ", "ショ"], ["チャ", "チュ", "チョ"], ["ニャ", "ニュ", "ニョ"], ["ヒャ", "ヒュ", "ヒョ"], ["ミャ", "ミュ", "ミョ"], ["リャ", "リュ", "リョ"], ["ギャ", "ギュ", "ギョ"], ["ジャ", "ジュ", "ジョ"], ["ビャ", "ビュ", "ビョ"], ["ピャ", "ピュ", "ピョ"]]}, "grammar": [{"id": "g01", "title": "X は Y です", "pattern": "X は Y です。", "meaning": "X is Y.", "core": true, "lesson": 1, "explanation": "Use は to mark the topic and です to make a polite sentence. は is pronounced wa when used as a particle.", "examples": [["わたしは学生です。", "I am a student."], ["これは本です。", "This is a book."]], "quiz": {"q": "Fill: I am Tanaka. わたし___田中です。", "a": "は", "choices": ["は", "を", "で", "に"]}}, {"id": "g02", "title": "Negative: ではありません / じゃありません", "pattern": "X は Y ではありません。", "meaning": "X is not Y.", "core": true, "lesson": 1, "explanation": "The polite negative of です is ではありません. In conversation, じゃありません is common.", "examples": [["これは新聞ではありません。", "This is not a newspaper."], ["あの人は先生じゃありません。", "That person is not a teacher."]], "quiz": {"q": "This is not a car. これは車___ありません。", "a": "では", "choices": ["では", "を", "に", "から"]}}, {"id": "g03", "title": "Questions with か", "pattern": "Sentence + か。", "meaning": "Turns a polite sentence into a question.", "core": true, "lesson": 1, "explanation": "Put か at the end of a polite sentence. Japanese questions do not need a question mark, but learners may use one in notes.", "examples": [["田中さんは学生ですか。", "Is Tanaka a student?"], ["これは何ですか。", "What is this?"]], "quiz": {"q": "Add the question particle: 日本人です___。", "a": "か", "choices": ["か", "も", "ね", "よ"]}}, {"id": "g04", "title": "も: also / too", "pattern": "X も Y です。", "meaning": "X is also Y.", "core": true, "lesson": 1, "explanation": "も replaces は when you mean ‘also’ or ‘too’. It can also follow other particles in later patterns.", "examples": [["わたしも学生です。", "I am a student too."], ["これも水です。", "This is also water."]], "quiz": {"q": "I am also a student. わたし___学生です。", "a": "も", "choices": ["も", "は", "を", "で"]}}, {"id": "g05", "title": "の: possession / description", "pattern": "A の B", "meaning": "B of A / A’s B / B described by A.", "core": true, "lesson": 1, "explanation": "の connects nouns. The first noun modifies or owns the second noun.", "examples": [["わたしの名前", "my name"], ["日本語の本", "a Japanese-language book"]], "quiz": {"q": "my book = わたし___本", "a": "の", "choices": ["の", "は", "が", "を"]}}, {"id": "g06", "title": "こ・そ・あ・ど words", "pattern": "これ・それ・あれ・どれ / この・その・あの・どの", "meaning": "this / that / that over there / which", "core": true, "lesson": 2, "explanation": "こ is near the speaker, そ near the listener, あ away from both, and ど is for questions.", "examples": [["これは何ですか。", "What is this?"], ["そのかばんはいくらですか。", "How much is that bag near you?"]], "quiz": {"q": "Which one is it? ___ですか。", "a": "どれ", "choices": ["どれ", "これ", "それ", "あれ"]}}, {"id": "g07", "title": "ここ・そこ・あそこ・どこ", "pattern": "ここ / そこ / あそこ / どこ", "meaning": "here / there / over there / where", "core": true, "lesson": 2, "explanation": "These are place words. Add は or に depending on the sentence.", "examples": [["トイレはどこですか。", "Where is the toilet?"], ["駅はあそこです。", "The station is over there."]], "quiz": {"q": "Where is the school? 学校は___ですか。", "a": "どこ", "choices": ["どこ", "だれ", "いつ", "何"]}}, {"id": "g08", "title": "だれ・何・いつ・いくら", "pattern": "question word + ですか / verb ますか", "meaning": "who / what / when / how much", "core": true, "lesson": 2, "explanation": "Question words stay in the position where the answer would appear; か comes at the end.", "examples": [["これは何ですか。", "What is this?"], ["テストはいつですか。", "When is the test?"]], "quiz": {"q": "How much is this? これは___ですか。", "a": "いくら", "choices": ["いくら", "だれ", "いつ", "どこ"]}}, {"id": "g09", "title": "Numbers and counters", "pattern": "number + counter", "meaning": "one person, two books, three o’clock, etc.", "core": true, "lesson": 2, "explanation": "Japanese uses counters after numbers. N5 essentials include 時, 分, 人, 枚, 本, 個, 円, 歳.", "examples": [["三時半です。", "It is 3:30."], ["りんごを二つ買います。", "I will buy two apples."]], "quiz": {"q": "3 o’clock = 三___", "a": "時", "choices": ["時", "人", "枚", "本"]}}, {"id": "g10", "title": "Time particle に", "pattern": "time に verb", "meaning": "do something at a specific time", "core": true, "lesson": 2, "explanation": "Use に with specific times like 7:00, Monday, May 5. Do not usually use に with vague words like 今日 or 明日.", "examples": [["七時に起きます。", "I wake up at seven."], ["月曜日に学校へ行きます。", "I go to school on Monday."]], "quiz": {"q": "I sleep at 11. 十一時___寝ます。", "a": "に", "choices": ["に", "を", "で", "が"]}}, {"id": "g11", "title": "へ / に for destination", "pattern": "place へ/に 行きます・来ます・帰ります", "meaning": "go/come/return to a place", "core": true, "lesson": 3, "explanation": "へ marks direction and is pronounced e as a particle. に marks destination more directly. Both appear in N5.", "examples": [["学校へ行きます。", "I go to school."], ["家に帰ります。", "I return home."]], "quiz": {"q": "I go to Japan. 日本___行きます。", "a": "へ", "choices": ["へ", "を", "で", "が"]}}, {"id": "g12", "title": "で: action location / tool", "pattern": "place で verb / tool で verb", "meaning": "do at; do using", "core": true, "lesson": 3, "explanation": "Use で for where an action happens, or the means/instrument used to do something.", "examples": [["図書館で勉強します。", "I study at the library."], ["バスで行きます。", "I go by bus."]], "quiz": {"q": "I eat at home. 家___食べます。", "a": "で", "choices": ["で", "に", "を", "が"]}}, {"id": "g13", "title": "を: direct object", "pattern": "object を verb", "meaning": "marks what the verb acts on", "core": true, "lesson": 3, "explanation": "を is pronounced o as a particle. It often appears before verbs like 食べます, 飲みます, 見ます, 読みます, 買います.", "examples": [["水を飲みます。", "I drink water."], ["映画を見ます。", "I watch a movie."]], "quiz": {"q": "I read a book. 本___読みます。", "a": "を", "choices": ["を", "は", "で", "に"]}}, {"id": "g14", "title": "と: and / with", "pattern": "A と B / person と verb", "meaning": "and; with", "core": true, "lesson": 3, "explanation": "と can list nouns completely, or mark the person you do something with.", "examples": [["パンとコーヒー", "bread and coffee"], ["友だちと行きます。", "I go with a friend."]], "quiz": {"q": "I go with my friend. 友だち___行きます。", "a": "と", "choices": ["と", "も", "を", "へ"]}}, {"id": "g15", "title": "や: A, B, and so on", "pattern": "A や B など", "meaning": "A and B among other things", "core": false, "lesson": 3, "explanation": "Use や when the list is incomplete. など means ‘and so on’. This is useful for reading even if と is more basic.", "examples": [["机の上に本やノートがあります。", "There are books, notebooks, and such on the desk."], ["日本や韓国に行きたいです。", "I want to go to Japan, Korea, and similar places."]], "quiz": {"q": "Books, pens, etc. 本___ペンなど", "a": "や", "choices": ["や", "と", "を", "が"]}}, {"id": "g16", "title": "から・まで", "pattern": "A から B まで", "meaning": "from A to B / from A until B", "core": true, "lesson": 3, "explanation": "から marks the starting point; まで marks the endpoint. They work with time and places.", "examples": [["九時から五時まで働きます。", "I work from 9 to 5."], ["家から駅まで歩きます。", "I walk from home to the station."]], "quiz": {"q": "from 8 to 10 = 八時___十時まで", "a": "から", "choices": ["から", "まで", "で", "に"]}}, {"id": "g17", "title": "ね・よ sentence endings", "pattern": "sentence + ね / よ", "meaning": "isn’t it? / you know!", "core": false, "lesson": 3, "explanation": "ね seeks agreement; よ gives new information or emphasis. They are common in listening.", "examples": [["今日は寒いですね。", "It’s cold today, isn’t it?"], ["あの店は安いですよ。", "That shop is cheap, you know."]], "quiz": {"q": "It’s delicious, isn’t it? おいしいです___。", "a": "ね", "choices": ["ね", "を", "で", "に"]}}, {"id": "g18", "title": "あります・います", "pattern": "thing があります / person・animal がいます", "meaning": "there is / have", "core": true, "lesson": 4, "explanation": "Use あります for inanimate things and plants; use います for people and animals.", "examples": [["机があります。", "There is a desk."], ["猫がいます。", "There is a cat."]], "quiz": {"q": "There is a teacher. 先生が___。", "a": "います", "choices": ["います", "あります", "です", "します"]}}, {"id": "g19", "title": "Location of existence", "pattern": "place に noun が あります/います", "meaning": "There is/are noun at place.", "core": true, "lesson": 4, "explanation": "Use に to mark the place where something exists.", "examples": [["部屋にテレビがあります。", "There is a TV in the room."], ["学校に学生がいます。", "There are students at school."]], "quiz": {"q": "There is a book on the desk. 机の上___本があります。", "a": "に", "choices": ["に", "で", "を", "へ"]}}, {"id": "g20", "title": "Position words", "pattern": "noun の 上/下/中/前/後ろ/右/左/となり", "meaning": "on, under, inside, in front of, behind, right, left, next to", "core": true, "lesson": 4, "explanation": "Position words behave like nouns, so use の before them.", "examples": [["本は机の上にあります。", "The book is on the desk."], ["銀行は駅のとなりです。", "The bank is next to the station."]], "quiz": {"q": "under the chair = いす___下", "a": "の", "choices": ["の", "に", "を", "で"]}}, {"id": "g21", "title": "い-adjectives", "pattern": "い-adjective + noun / い-adjective です", "meaning": "describing nouns and sentences", "core": true, "lesson": 4, "explanation": "い-adjectives end in い, such as 高い, 新しい, おいしい. They can directly modify nouns.", "examples": [["新しい車です。", "It is a new car."], ["この本はおもしろいです。", "This book is interesting."]], "quiz": {"q": "a big house = ___家", "a": "大きい", "choices": ["大きい", "大きな", "大きく", "大きくて"]}}, {"id": "g22", "title": "な-adjectives", "pattern": "な-adjective な noun / な-adjective です", "meaning": "describing nouns and sentences", "core": true, "lesson": 4, "explanation": "な-adjectives need な before a noun but not before です. Examples: 静か, きれい, 好き, 便利.", "examples": [["静かな町です。", "It is a quiet town."], ["この部屋はきれいです。", "This room is clean/pretty."]], "quiz": {"q": "a quiet room = 静か___部屋", "a": "な", "choices": ["な", "の", "に", "を"]}}, {"id": "g23", "title": "Adjective negative and past", "pattern": "高くない / 高かった / 高くなかった; 静かではない / 静かだった", "meaning": "not, was, was not", "core": true, "lesson": 4, "explanation": "い-adjectives conjugate by changing final い. な-adjectives use です forms like nouns.", "examples": [["昨日は寒かったです。", "Yesterday was cold."], ["この町は静かではありません。", "This town is not quiet."]], "quiz": {"q": "not expensive = 高___ないです", "a": "く", "choices": ["く", "い", "な", "で"]}}, {"id": "g24", "title": "Verb groups: う, る, irregular", "pattern": "dictionary form → ます form", "meaning": "how verbs are grouped", "core": true, "lesson": 5, "explanation": "N5 uses polite forms heavily, but knowing groups helps with て-form and plain forms. Irregular verbs are する and 来る.", "examples": [["飲む → 飲みます", "to drink → drink"], ["食べる → 食べます", "to eat → eat"]], "quiz": {"q": "Which is irregular?", "a": "する", "choices": ["する", "飲む", "食べる", "行く"]}}, {"id": "g25", "title": "ます / ません", "pattern": "verb ます / verb ません", "meaning": "polite present/future affirmative and negative", "core": true, "lesson": 5, "explanation": "The same form covers present habits and future actions. Time words tell the difference.", "examples": [["毎日勉強します。", "I study every day."], ["今日は働きません。", "I will not work today."]], "quiz": {"q": "I don’t drink coffee. コーヒーを飲み___。", "a": "ません", "choices": ["ません", "ます", "ました", "ましょう"]}}, {"id": "g26", "title": "ました / ませんでした", "pattern": "verb ました / verb ませんでした", "meaning": "polite past affirmative and negative", "core": true, "lesson": 5, "explanation": "Use these forms for completed past actions.", "examples": [["昨日映画を見ました。", "I watched a movie yesterday."], ["朝ご飯を食べませんでした。", "I did not eat breakfast."]], "quiz": {"q": "I went yesterday. 昨日行き___。", "a": "ました", "choices": ["ました", "ます", "ません", "たい"]}}, {"id": "g27", "title": "Dictionary form", "pattern": "食べる・飲む・行く", "meaning": "plain non-past verb form", "core": true, "lesson": 5, "explanation": "Dictionary form is needed for patterns like ことができます and 前に. It also appears in dictionary entries.", "examples": [["日本語を話すことができます。", "I can speak Japanese."], ["寝る前に本を読みます。", "I read before sleeping."]], "quiz": {"q": "Dictionary form of 食べます?", "a": "食べる", "choices": ["食べる", "食べて", "食べた", "食べない"]}}, {"id": "g28", "title": "て-form basics", "pattern": "verb て / で", "meaning": "connect actions; request forms; ongoing actions", "core": true, "lesson": 6, "explanation": "て-form is one of the most important forms. It connects clauses and supports many N5 patterns.", "examples": [["食べて、寝ます。", "I eat and sleep."], ["本を読んで、勉強します。", "I read a book and study."]], "quiz": {"q": "て-form of 行く is?", "a": "行って", "choices": ["行って", "行いて", "行んで", "行て"]}}, {"id": "g29", "title": "てください", "pattern": "verbてください", "meaning": "Please do…", "core": true, "lesson": 6, "explanation": "A polite request. Use with classroom, directions, and daily-life instructions.", "examples": [["名前を書いてください。", "Please write your name."], ["ちょっと待ってください。", "Please wait a moment."]], "quiz": {"q": "Please listen. 聞い___ください。", "a": "て", "choices": ["て", "た", "ない", "ます"]}}, {"id": "g30", "title": "てもいいです", "pattern": "verbて もいいです", "meaning": "may do; it is okay to do", "core": true, "lesson": 6, "explanation": "Use to ask or give permission. The question form is てもいいですか.", "examples": [["写真を撮ってもいいですか。", "May I take a photo?"], ["ここで休んでもいいです。", "You may rest here."]], "quiz": {"q": "May I read this? これを読ん___もいいですか。", "a": "で", "choices": ["で", "て", "だ", "ます"]}}, {"id": "g31", "title": "てはいけません", "pattern": "verbて はいけません", "meaning": "must not do", "core": true, "lesson": 6, "explanation": "A rule or prohibition. In casual speech you may hear ちゃだめ, but JLPT reading often uses the polite form.", "examples": [["ここでたばこを吸ってはいけません。", "You must not smoke here."], ["写真を撮ってはいけません。", "You must not take photos."]], "quiz": {"q": "You must not enter. 入っ___はいけません。", "a": "て", "choices": ["て", "た", "ます", "ない"]}}, {"id": "g32", "title": "ています", "pattern": "verbて います", "meaning": "is doing; ongoing state", "core": true, "lesson": 6, "explanation": "For action verbs, it often means ‘is doing’. For some verbs like 住む, 知る, 結婚する, it describes a state.", "examples": [["今、勉強しています。", "I am studying now."], ["大阪に住んでいます。", "I live in Osaka."]], "quiz": {"q": "I am eating now. 今、食べ___います。", "a": "て", "choices": ["て", "た", "ます", "ない"]}}, {"id": "g33", "title": "に行きます for purpose", "pattern": "verb stem / noun + に 行きます", "meaning": "go to do; go for", "core": true, "lesson": 7, "explanation": "Use the masu-stem of a verb before に行きます to show purpose of movement.", "examples": [["映画を見に行きます。", "I will go to watch a movie."], ["日本へ勉強に来ました。", "I came to Japan to study."]], "quiz": {"q": "go to buy = 買い___行きます", "a": "に", "choices": ["に", "を", "で", "が"]}}, {"id": "g34", "title": "ましょう / ませんか", "pattern": "verbましょう / verbませんか", "meaning": "let’s; won’t you…?", "core": true, "lesson": 7, "explanation": "ましょう suggests doing something together. ませんか is a polite invitation.", "examples": [["一緒に行きましょう。", "Let’s go together."], ["コーヒーを飲みませんか。", "Would you like to drink coffee?"]], "quiz": {"q": "Let’s study. 勉強し___。", "a": "ましょう", "choices": ["ましょう", "ませんか", "たい", "ました"]}}, {"id": "g35", "title": "たいです", "pattern": "verb stem + たいです", "meaning": "want to do", "core": true, "lesson": 7, "explanation": "たい conjugates like an い-adjective: 行きたい, 行きたくない, 行きたかった.", "examples": [["日本へ行きたいです。", "I want to go to Japan."], ["今日は働きたくないです。", "I do not want to work today."]], "quiz": {"q": "want to eat = 食べ___です", "a": "たい", "choices": ["たい", "て", "ます", "た"]}}, {"id": "g36", "title": "が好き・嫌い・上手・下手", "pattern": "noun が 好き/嫌い/上手/下手 です", "meaning": "like/dislike; skilled/bad at", "core": true, "lesson": 7, "explanation": "These words are な-adjectives and usually take が for the thing liked or skill area.", "examples": [["日本語が好きです。", "I like Japanese."], ["歌が上手です。", "He/she is good at singing."]], "quiz": {"q": "I like sushi. すし___好きです。", "a": "が", "choices": ["が", "を", "で", "に"]}}, {"id": "g37", "title": "ほしいです", "pattern": "noun が ほしいです", "meaning": "want a thing", "core": true, "lesson": 7, "explanation": "Use たい for actions and ほしい for objects. Usually use が with the wanted object.", "examples": [["新しいパソコンがほしいです。", "I want a new computer."], ["時間がほしいです。", "I want time."]], "quiz": {"q": "I want water. 水___ほしいです。", "a": "が", "choices": ["が", "を", "で", "に"]}}, {"id": "g38", "title": "ことができます", "pattern": "dictionary verb + ことができます", "meaning": "can do", "core": true, "lesson": 7, "explanation": "A safe N5 way to express ability. The dictionary verb becomes a noun phrase with こと.", "examples": [["漢字を読むことができます。", "I can read kanji."], ["車を運転することができません。", "I cannot drive a car."]], "quiz": {"q": "can swim = 泳ぐ___ができます", "a": "こと", "choices": ["こと", "もの", "の", "人"]}}, {"id": "g39", "title": "たり〜たりします", "pattern": "verbたり、verbたりします", "meaning": "do things such as A and B", "core": false, "lesson": 8, "explanation": "Use the past plain form + り. It lists representative actions, not necessarily in order.", "examples": [["日曜日は本を読んだり、テレビを見たりします。", "On Sundays I do things like read books and watch TV."], ["公園で歩いたり、写真を撮ったりしました。", "At the park I walked, took photos, and so on."]], "quiz": {"q": "read and watch etc. 読ん___、見たりします。", "a": "だり", "choices": ["だり", "たり", "で", "て"]}}, {"id": "g40", "title": "から: because", "pattern": "reason から、result", "meaning": "because / so", "core": true, "lesson": 8, "explanation": "から after a sentence gives a reason. It can be used after です or plain forms.", "examples": [["雨ですから、行きません。", "Because it is raining, I won’t go."], ["明日テストがありますから、勉強します。", "Because there is a test tomorrow, I will study."]], "quiz": {"q": "Because it is hot: 暑いです___", "a": "から", "choices": ["から", "まで", "でも", "より"]}}, {"id": "g41", "title": "が: but / subject marker", "pattern": "sentence が sentence / noun が adjective", "meaning": "but; subject/focus marker", "core": true, "lesson": 8, "explanation": "が marks the subject or new/focused information. Between clauses it can mean ‘but’. Context decides.", "examples": [["日本語は難しいですが、おもしろいです。", "Japanese is difficult, but interesting."], ["だれが来ますか。", "Who is coming?"]], "quiz": {"q": "Who came? だれ___来ましたか。", "a": "が", "choices": ["が", "は", "を", "で"]}}, {"id": "g42", "title": "けど / けれども", "pattern": "sentence けど sentence", "meaning": "but / although", "core": false, "lesson": 8, "explanation": "A conversational ‘but’. けれども is more formal. Useful for listening and natural speech.", "examples": [["安いけど、おいしいです。", "It is cheap, but delicious."], ["行きたいけど、時間がありません。", "I want to go, but I don’t have time."]], "quiz": {"q": "cheap but far = 安い___遠いです", "a": "けど", "choices": ["けど", "から", "まで", "より"]}}, {"id": "g43", "title": "Comparisons: より / ほうが", "pattern": "A は B より adjective / A のほうが adjective", "meaning": "A is more adjective than B", "core": true, "lesson": 8, "explanation": "Use より after the thing being compared against. のほうが marks the side that has more of the quality.", "examples": [["日本語は英語より難しいです。", "Japanese is harder than English."], ["この本のほうがおもしろいです。", "This book is more interesting."]], "quiz": {"q": "Tokyo is bigger than Kyoto. 東京は京都___大きいです。", "a": "より", "choices": ["より", "まで", "から", "だけ"]}}, {"id": "g44", "title": "どちら / どっち + のほうが", "pattern": "A と B と どちらが adjective ですか", "meaning": "Which is more…?", "core": true, "lesson": 8, "explanation": "Use どちら for two choices. Answer with A のほうが…です.", "examples": [["犬と猫とどちらが好きですか。", "Which do you like more, dogs or cats?"], ["猫のほうが好きです。", "I like cats more."]], "quiz": {"q": "Which is cheaper? どちら___安いですか。", "a": "が", "choices": ["が", "を", "で", "に"]}}, {"id": "g45", "title": "いちばん", "pattern": "group で noun が いちばん adjective", "meaning": "the most / best", "core": true, "lesson": 8, "explanation": "Use いちばん for superlatives. It often appears with で to mark the group.", "examples": [["季節で春がいちばん好きです。", "Among seasons, I like spring the most."], ["この店でラーメンがいちばんおいしいです。", "At this shop, ramen is the most delicious."]], "quiz": {"q": "the most interesting = ___おもしろい", "a": "いちばん", "choices": ["いちばん", "もっと", "より", "だけ"]}}, {"id": "g46", "title": "前に / 後で", "pattern": "noun の/verb dictionary 前に; noun の/verbた 後で", "meaning": "before / after", "core": true, "lesson": 9, "explanation": "Before uses dictionary form + 前に. After uses noun の後で or past plain verb + 後で.", "examples": [["寝る前に歯を磨きます。", "I brush my teeth before sleeping."], ["授業の後で、図書館へ行きます。", "After class, I go to the library."]], "quiz": {"q": "before eating = 食べる___に", "a": "前", "choices": ["前", "後", "中", "上"]}}, {"id": "g47", "title": "とき", "pattern": "noun の/adj/verb + とき", "meaning": "when; at the time of", "core": true, "lesson": 9, "explanation": "とき turns a clause into a time expression. Use な before とき with な-adjectives.", "examples": [["暇なとき、本を読みます。", "When I am free, I read books."], ["子どものとき、東京に住んでいました。", "When I was a child, I lived in Tokyo."]], "quiz": {"q": "when free = 暇___とき", "a": "な", "choices": ["な", "の", "に", "を"]}}, {"id": "g48", "title": "ながら", "pattern": "verb stem + ながら", "meaning": "while doing", "core": false, "lesson": 9, "explanation": "Shows two actions done at the same time by the same person.", "examples": [["音楽を聞きながら勉強します。", "I study while listening to music."], ["歩きながら話しました。", "We talked while walking."]], "quiz": {"q": "while eating = 食べ___ながら", "a": "ながら", "choices": ["ながら", "て", "ます", "たい"]}}, {"id": "g49", "title": "もう / まだ", "pattern": "もう verbました / まだ verbていません", "meaning": "already / not yet / still", "core": true, "lesson": 9, "explanation": "もう means already in affirmative questions or statements. まだ means not yet with negative, or still with affirmative.", "examples": [["もう昼ご飯を食べました。", "I already ate lunch."], ["まだ宿題をしていません。", "I have not done homework yet."]], "quiz": {"q": "not yet = ___していません", "a": "まだ", "choices": ["まだ", "もう", "いつも", "すぐ"]}}, {"id": "g50", "title": "だけ / しか〜ない", "pattern": "noun だけ / noun しか negative", "meaning": "only", "core": false, "lesson": 9, "explanation": "だけ is straightforward ‘only’. しか must be used with a negative verb and often sounds like ‘nothing but’. ", "examples": [["水だけ飲みます。", "I drink only water."], ["百円しかありません。", "I have only 100 yen."]], "quiz": {"q": "Only one person came. 一人___来ました。", "a": "だけ", "choices": ["だけ", "しか", "まで", "から"]}}, {"id": "g51", "title": "くらい / ぐらい", "pattern": "number/time + くらい", "meaning": "about / approximately", "core": true, "lesson": 9, "explanation": "くらい and ぐらい both mean about. Use it with time, money, quantity, and degree.", "examples": [["三十分ぐらいかかります。", "It takes about thirty minutes."], ["千円くらいです。", "It is about 1,000 yen."]], "quiz": {"q": "about two hours = 二時間___", "a": "ぐらい", "choices": ["ぐらい", "だけ", "から", "まで"]}}, {"id": "g52", "title": "Frequency adverbs", "pattern": "いつも / よく / ときどき / あまり / 全然", "meaning": "always / often / sometimes / not much / not at all", "core": true, "lesson": 9, "explanation": "あまり and 全然 usually pair with negative verbs or adjectives.", "examples": [["よく映画を見ます。", "I often watch movies."], ["魚はあまり食べません。", "I don’t eat fish much."]], "quiz": {"q": "I don’t understand at all. ___わかりません。", "a": "全然", "choices": ["全然", "いつも", "よく", "たくさん"]}}, {"id": "g53", "title": "なければなりません", "pattern": "ない-form stem + ければなりません", "meaning": "must do", "core": true, "lesson": 10, "explanation": "A formal way to say obligation. N5 learners should recognize it in signs and instructions.", "examples": [["薬を飲まなければなりません。", "I must take medicine."], ["明日早く起きなければなりません。", "I must wake up early tomorrow."]], "quiz": {"q": "must go = 行か___なりません", "a": "なければ", "choices": ["なければ", "なくても", "ないで", "なくて"]}}, {"id": "g54", "title": "なくてもいいです", "pattern": "ない-form stem + くてもいいです", "meaning": "do not have to do", "core": true, "lesson": 10, "explanation": "It gives permission not to do something.", "examples": [["今日は来なくてもいいです。", "You do not have to come today."], ["名前を書かなくてもいいです。", "You do not have to write your name."]], "quiz": {"q": "don’t have to eat = 食べ___もいいです", "a": "なくて", "choices": ["なくて", "なければ", "ないで", "なく"]}}, {"id": "g55", "title": "ないでください", "pattern": "ない-form + でください", "meaning": "Please don’t do…", "core": true, "lesson": 10, "explanation": "A polite negative request. Different from てはいけません, which is a rule/prohibition.", "examples": [["ここで写真を撮らないでください。", "Please don’t take photos here."], ["心配しないでください。", "Please don’t worry."]], "quiz": {"q": "Please don’t write. 書か___ください。", "a": "ないで", "choices": ["ないで", "なくて", "なければ", "ません"]}}, {"id": "g56", "title": "ので: because", "pattern": "reason ので result", "meaning": "because; since", "core": false, "lesson": 10, "explanation": "Softer than から and common in polite explanations. With nouns/な-adjectives, use なので.", "examples": [["雨なので、行きません。", "Since it is raining, I won’t go."], ["忙しいので、休みません。", "Because I am busy, I won’t rest."]], "quiz": {"q": "because it is quiet = 静か___", "a": "なので", "choices": ["なので", "ので", "からで", "より"]}}, {"id": "g57", "title": "でしょう / だろう basics", "pattern": "sentence でしょう", "meaning": "probably; right?", "core": false, "lesson": 10, "explanation": "N5 listening may include でしょう as a polite guess or soft confirmation.", "examples": [["明日は雨でしょう。", "It will probably rain tomorrow."], ["駅は近いでしょう。", "The station is probably close, right?"]], "quiz": {"q": "probably cold = 寒い___", "a": "でしょう", "choices": ["でしょう", "でした", "では", "ですか"]}}, {"id": "g58", "title": "ください with nouns", "pattern": "noun をください", "meaning": "Please give me noun.", "core": true, "lesson": 10, "explanation": "Useful for shopping and restaurants. For actions, use てください.", "examples": [["水をください。", "Water, please."], ["これをください。", "I’ll take this, please."]], "quiz": {"q": "This one, please. これ___ください。", "a": "を", "choices": ["を", "が", "に", "で"]}}, {"id": "g59", "title": "かどうか", "pattern": "sentence/plain + かどうか", "meaning": "whether or not", "core": false, "lesson": 11, "explanation": "A buffer pattern often seen after N5. Learn to recognize it in simple reading.", "examples": [["明日行くかどうかわかりません。", "I don’t know whether I will go tomorrow."], ["安いかどうか聞きます。", "I will ask whether it is cheap."]], "quiz": {"q": "whether it is good = いい___どうか", "a": "か", "choices": ["か", "が", "を", "で"]}}, {"id": "g60", "title": "と言います", "pattern": "phrase/name と言います", "meaning": "is called; say", "core": false, "lesson": 11, "explanation": "Useful for introducing names and quoted phrases. More detailed quote grammar is beyond N5.", "examples": [["わたしはアリと言います。", "I am called Ali."], ["日本語で『ありがとう』と言います。", "In Japanese, people say ‘arigatou’."]], "quiz": {"q": "My name is Ken. ケン___言います。", "a": "と", "choices": ["と", "を", "が", "で"]}}], "kanji": [{"id": "k001", "kanji": "一", "reading": "いち, ひと", "meaning": "one", "lesson": 1, "example": "一人 one person"}, {"id": "k002", "kanji": "二", "reading": "に, ふた", "meaning": "two", "lesson": 1, "example": "二月 February"}, {"id": "k003", "kanji": "三", "reading": "さん, みっ", "meaning": "three", "lesson": 1, "example": "三日 three days/3rd day"}, {"id": "k004", "kanji": "四", "reading": "し, よん, よ", "meaning": "four", ake. Bread is 150 yen. Cake is 300 yen. The shop is open from 9 a.m. to 8 p.m.", "questions": [{"q": "パンはいくらですか。", "choices": ["百五十円", "三百円", "九百円", "八十円"], "a": "百五十円"}, {"q": "店はどこにありますか。", "choices": ["駅の近く", "学校の中", "公園の前", "家の後ろ"], "a": "駅の近く"}]}, {"title": "Weekend plan", "level": "normal", "jp": "日曜日に友だちと映画を見に行きます。映画は午後二時からです。映画の後で、レストランで晩ご飯を食べます。雨だったら、タクシーで帰ります。", "en": "On Sunday I will go with a friend to watch a movie. The movie starts at 2 p.m. After the movie, we will eat dinner at a restaurant. If it rains, we will go home by taxi.", "questions": [{"q": "だれと映画を見ますか。", "choices": ["友だち", "先生", "家族", "一人"], "a": "友だち"}, {"q": "映画の後で何をしますか。", "choices": ["晩ご飯を食べます", "学校へ行きます", "買い物します", "勉強します"], "a": "晩ご飯を食べます"}]}, {"title": "Lost item notice", "level": "normal", "jp": "図書館に黒いかばんがありました。かばんの中に日本語の本とノートがあります。名前はありません。心当たりのある人は受付に来てください。", "en": "There was a black bag in the library. Inside the bag are a Japanese book and a notebook. There is no name. If you think it is yours, please come to the reception desk.", "questions": [{"q": "かばんは何色ですか。", "choices": ["黒い", "白い", "赤い", "青い"], "a": "黒い"}, {"q": "かばんの中に何がありますか。", "choices": ["本とノート", "財布と鍵", "カメラ", "食べ物"], "a": "本とノート"}]}, {"title": "Weather message", "level": "normal", "jp": "明日は朝から雨でしょう。風も強いですから、傘を持って行ってください。午後は少し寒くなります。暖かい服を着たほうがいいです。", "en": "Tomorrow it will probably rain from morning. The wind will also be strong, so please take an umbrella. In the afternoon it will become a little cold. It is better to wear warm clothes.", "questions": [{"q": "明日の天気はどうですか。", "choices": ["雨", "晴れ", "雪", "暑い"], "a": "雨"}, {"q": "何を持って行きますか。", "choices": ["傘", "本", "時計", "水"], "a": "傘"}]}, {"title": "Email from a friend", "level": "exam", "jp": "アリさんへ。土曜日の午後、うちで日本語を勉強しませんか。駅からうちまで歩いて十分ぐらいです。三時に駅の前で待っています。来ることができないときは、電話してください。ケン", "en": "To Ali. On Saturday afternoon, would you like to study Japanese at my house? It is about ten minutes on foot from the station to my house. I will wait in front of the station at 3.    if(state.mode==='kanji'){ front=`<div class="mega">${item.kanji}</div>`; back=`<b>${esc(item.meaning)}</b><p class="jp">${esc(item.reading)}</p><small class="jp">${esc(item.example)}</small>`; }
   if(state.mode==='grammar'){ front=`<h3>${esc(item.title)}</h3><div class="pattern jp">${esc(item.pattern)}</div>`; back=`<b>${esc(item.meaning)}</b><p>${esc(item.explanation)}</p><small class="jp">${esc(item.examples[0][0])}</small>`; }
   return layout('Flashcards','Use active recall: answer before reveal. Mark known only when you can read, understand, and use it.', `<div class="toolbar"><select onchange="state.mode=this.value; state.flashIndex=0; state.reveal=false; render()"><option value="vocab" ${state.mode==='vocab'?'selected':''}>Vocabulary</option><option value="kanji" ${state.mode==='kanji'?'selected':''}>Kanji</option><option value="grammar" ${state.mode==='grammar'?'selected':''}>Grammar</option></select><button class="btn secondary" onclick="state.flashIndex=Math.max(0,state.flashIndex-1); state.reveal=false; render()">Previous</button><button class="btn" onclick="state.reveal=!state.reveal; render()">${state.reveal?'Hide':'Reveal'}</button><button class="btn secondary" onclick="state.flashIndex++; state.reveal=false; render()">Next</button></div><div class="card flashcard"><div class="flash-inner">${front}${state.reveal?`<div class="answer">${back}</div>`:''}</div></div><div class="toolbar"><button class="btn secondary" onclick="speakEncoded('${enc(state.mode==='kanji'?item.example.split(' ')[0]:state.mode==='grammar'?item.examples[0][0]:item.jp)}')">Play</button><button class="btn good" onclick="mark('${id}','${type}'); state.flashIndex++; state.reveal=false; render();">Know it</button><button class="btn warn" onclick="markHard('${id}','${type}'); state.flashIndex++; state.reveal=false; render();">Hard</button></div><p class="tiny">Card ${(state.flashIndex%pool.length)+1} / ${pool.length}</p>`); },
 quiz(){
   if(!state.quiz) newQuiz();
   const q=state.quiz; const done=q.index>=q.items.length;
   if(done) return layout('Quiz complete',`Score: ${q.correct} / ${q.items.length}`, `<div class="toolbar"><button class="btn accent" onclick="newQuiz(); render()">New quiz</button><button class="btn secondary" onclick="setView('progress')">Review progress</button></div>`);
   const it=q.items[q.index];
   return layout('Quiz mode','Mixed multiple-choice practice. Aim for 90%+ before moving to timed mock exams.', `<div class="toolbar"><select onchange="state.mode=this.value; newQuiz(); render()"><option value="vocab" ${state.mode==='vocab'?'selected':''}>Vocabulary meaning</option><option value="reading" ${state.mode==='reading'?'selected':''}>Vocabulary reading</option><option value="kanji" ${state.mode==='kanji'?'selected':''}>Kanji meaning</option><option value="grammar" ${state.mode==='grammar'?'selected':''}>Grammar particles/patterns</option></select><button class="btn secondary" onclick="newQuiz(); render()">Restart</button></div><div class="card"><p class="tiny">Question ${q.index+1} / ${q.items.length} • Score ${q.correct}</p><h3>${it.prompt}</h3>${it.jp?`<div class="bigjp">${esc(it.jp)}</div>`:''}<div class="choices">${it.choices.map(c=>`<button class="choice ${it.answered?(c===it.answer?'correct':c===it.picked?'wrong':''):''}" onclick="answerQuiz('${esc(c)}')">${esc(c)}</button>`).join('')}</div>${it.answered?`<p class="notice"><b>Answer:</b> ${esc(it.answer)} ${it.note?`— ${esc(it.note)}`:''}</p><button class="btn" onclick="state.quiz.index++; render()">Next</button>`:''}</div>`); },
 reading(){
   return layout('Reading practice','Read first without translation. Then answer, check, and read aloud while listening to browser speech.', `<div class="grid two">${DATA.reading.map((r,idx)=>`<div class="reading-box"><span class="tag">${r.level}</span><h3>${esc(r.title)}</h3><p class="jp">${esc(r.jp)}</p><div class="toolbar"><button class="btn secondary" onclick="speakEncoded('${enc(r.jp)}', .78)">Play</button><button class="btn good" onclick="mark('read${idx}','reading')">✓ read</button></div><details><summary>Translation + questions</summary><p>${esc(r.en)}</p>${r.questions.map((qq,i)=>`<p><b>Q${i+1}.</b> <span class="jp">${esc(qq.q)}</span><br><small>Choices: ${qq.choices.map(esc).join(' / ')}</small><br><b>Answer:</b> ${esc(qq.a)}</p>`).join('')}</details></div>`).join('')}</div>`); },
 listening(){
   return layout('Listening + speaking lab','Use the Play button, listen without reading, then shadow aloud. Browser speech is synthetic, so supplement with native audio when possible.', `<div class="grid two">${DATA.listening.map((l,idx)=>`<div class="reading-box"><span class="tag">Listening ${idx+1}</span><h3>${esc(l.title)}</h3><p class="jp bigjp" style="font-size:1.45rem">${esc(l.jp)}</p><p>${esc(l.prompt)}</p><div class="toolbar"><button class="btn" onclick="speakEncoded('${enc(l.jp)}',.75)">Slow play</button><button class="btn secondary" onclick="speakEncoded('${enc(l.jp)}',.95)">Natural-ish</button><button class="btn good" onclick="mark('listen${idx}','listening')">✓ shadowed</button></div><details><summary>Show meaning and answer</summary><p>${esc(l.en)}</p><p><b>Answer:</b> <span class="jp">${esc(l.answer)}</span></p></details></div>`).join('')}</div><div class="notice" style="margin-top:16px"><b>Speaking drill:</b> after each line, repeat 3 times: once slowly, once at the same speed, once while looking away. Record yourself on your phone and compare rhythm, not perfection.</div>`); },
 mock(){
   if(!state.mock) makeMock();
   const m=state.mock; const done=m.index>=m.items.length;
   if(done) return layout('Mock exam result',`Estimated raw practice score: ${m.correct} / ${m.items.length}. Review every miss before retaking.`, `<div class="grid two"><div class="stat"><b>${Math.round(m.correct/m.items.length*100)}%</b><span>practice accuracy</span></div><div class="stat"><b>${m.items.length}</b><span>questions</span></div></div><div class="toolbar"><button class="btn accent" onclick="makeMock(); render()">Retake new mock</button><button class="btn secondary" onclick="setView('quiz')">Targeted quiz</button></div><div class="notice">This is a training mock, not an official JLPT scoring simulator. Official JLPT scores are scaled, so use this for readiness, timing, and weak-point detection.</div>`);
   const it=m.items[m.index];
   return layout('Mock exam trainer','A compact mixed test: vocabulary, kanji, grammar, reading, and listening-style prompts. Use it after finishing the syllabus.', `<div class="toolbar"><button class="btn secondary" onclick="makeMock(); render()">New mock</button><span class="pill">Question ${m.index+1} / ${m.items.length}</span><span class="pill">Score ${m.correct}</span></div><div class="card"><span class="tag">${esc(it.section)}</span><h3>${esc(it.prompt)}</h3>${it.jp?`<p class="bigjp" style="font-size:1.6rem">${esc(it.jp)}</p>`:''}${it.listen?`<button class="btn secondary" onclick="speakEncoded('${enc(it.listen)}',.78)">Play listening line</button>`:''}<div class="choices">${it.choices.map(c=>`<button class="choice ${it.answered?(c===it.answer?'correct':c===it.picked?'wrong':''):''}" onclick="answerMock('${esc(c)}')">${esc(c)}</button>`).join('')}</div>${it.answered?`<p class="notice"><b>Answer:</b> ${esc(it.answer)}</p><button class="btn" onclick="state.mock.index++; render()">Next</button>`:''}</div>`); },
 progress(){
   const m=mastered(), h=hard(), st=stats(); const total=DATA.vocab.length+DATA.kanji.length+DATA.grammar.length;
   const hardIds=Object.keys(h);
   return layout('Progress and review','Progress is saved in this browser only. Export a backup if you move devices.', `<div class="grid three"><div class="stat"><b>${Object.keys(m).length}</b><span>mastered / ${total}</span></div><div class="stat"><b>${hardIds.length}</b><span>hard items</span></div><div class="stat"><b>${st.correct}/${st.total}</b><span>quiz correct</span></div></div><div class="toolbar"><button class="btn secondary" onclick="exportProgress()">Export JSON</button><button class="btn danger" onclick="if(confirm('Reset all progress?')){localStorage.clear(); render();}">Reset all</button></div><h3>Hard-list review</h3><div class="list">${hardIds.length?hardIds.slice(0,80).map(id=>`<div class="row"><div><b>${esc(id)}</b><br><small>${esc(h[id].type)} • added ${new Date(h[id].t).toLocaleDateString()}</small></div><button class="btn good" onclick="mark('${id}','${h[id].type}'); const hh=hard(); delete hh['${id}']; save('hard',hh); render();">Move to mastered</button></div>`).join(''):'<p class="notice">No hard items yet. Mark difficult cards during study.</p>'}</div>`); }
};
function newQuiz(){
  const items=[];
  if(state.mode==='vocab') sample(DATA.vocab,20).forEach(v=>items.push({prompt:'Choose the meaning:', jp:v.jp+'（'+v.kana+'）', answer:v.en, choices:shuffle([v.en,...sample(DATA.vocab.filter(x=>x.id!==v.id),3).map(x=>x.en)]), note:v.cat}));
  else if(state.mode==='reading') sample(DATA.vocab,20).forEach(v=>items.push({prompt:'Choose the reading:', jp:v.jp, answer:v.kana, choices:shuffle([v.kana,...sample(DATA.vocab.filter(x=>x.id!==v.id),3).map(x=>x.kana)]), note:v.en}));
  else if(state.mode==='kanji') sample(DATA.kanji,20).forEach(k=>items.push({prompt:'Choose the meaning:', jp:k.kanji, answer:k.meaning, choices:shuffle([k.meaning,...sample(DATA.kanji.filter(x=>x.id!==k.id),3).map(x=>x.meaning)]), note:k.example}));
  else sample(DATA.grammar,15).forEach(g=>items.push({prompt:g.quiz.q, answer:g.quiz.a, choices:shuffle(g.quiz.choices), note:g.title}));
  state.quiz={items, index:0, correct:0};
}
function answerQuiz(choice){ const it=state.quiz.items[state.quiz.index]; if(it.answered) return; it.answered=true; it.picked=choice; if(choice===it.answer) state.quiz.correct++; const st=stats(); st.total++; if(choice===it.answer) st.correct++; st.history.push({t:Date.now(),mode:state.mode,ok:choice===it.answer}); save('stats',st); render(); }
function makeMock(){
 const items=[];
 sample(DATA.vocab,10).forEach(v=>items.push({section:'Vocabulary',prompt:'Choose the meaning.',jp:v.jp+'（'+v.kana+'）',answer:v.en,choices:shuffle([v.en,...sample(DATA.vocab.filter(x=>x.id!==v.id),3).map(x=>x.en)])}));
 sample(DATA.kanji,8).forEach(k=>items.push({section:'Kanji',prompt:'Choose the meaning.',jp:k.kanji,answer:k.meaning,choices:shuffle([k.meaning,...sample(DATA.kanji.filter(x=>x.id!==k.id),3).map(x=>x.meaning)])}));
 sample(DATA.grammar.filter(g=>g.core),10).forEach(g=>items.push({section:'Grammar',prompt:g.quiz.q,answer:g.quiz.a,choices:shuffle(g.quiz.choices)}));
 sample(DATA.reading,3).forEach(r=>{ const qq=r.questions[0]; items.push({section:'Reading',prompt:qq.q,jp:r.jp,answer:qq.a,choices:shuffle(qq.choices)}); });
 sample(DATA.listening,5).forEach(l=>items.push({section:'Listening',prompt:l.prompt,listen:l.jp,answer:l.answer,choices:shuffle([l.answer,'はい','いいえ','分かりません'].filter((x,i,a)=>a.indexOf(x)===i)).slice(0,4)}));
 state.mock={items:shuffle(items), index:0, correct:0};
}
function answerMock(choice){ const it=state.mock.items[state.mock.index]; if(it.answered) return; it.answered=true; it.picked=choice; if(choice===it.answer) state.mock.correct++; const st=stats(); st.total++; if(choice===it.answer) st.correct++; st.history.push({t:Date.now(),mode:'mock-'+it.section,ok:choice===it.answer}); save('stats',st); render(); }
function exportProgress(){ const blob=new Blob([JSON.stringify({mastered:mastered(), hard:hard(), stats:stats(), exported:new Date().toISOString()},null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='n5-progress.json'; a.click(); URL.revokeObjectURL(a.href); }
let ctx, drawing=false;
function drawCanvasGuide(){
  const c=$('#writeCanvas'); if(!c) return; const g=c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  g.save();
  g.strokeStyle='rgba(34,34,59,.13)'; g.lineWidth=2;
  for(let i=1;i<3;i++){ g.beginPath(); g.moveTo(c.width*i/3,0); g.lineTo(c.width*i/3,c.height); g.stroke(); }
  g.beginPath(); g.moveTo(0,c.height/2); g.lineTo(c.width,c.height/2); g.stroke();
  g.setLineDash([10,10]); g.strokeStyle='rgba(34,34,59,.10)';
  for(let col=0; col<3; col++) for(let row=0; row<2; row++){
    const x=col*c.width/3, y=row*c.height/2, w=c.width/3, h=c.height/2;
    g.beginPath(); g.moveTo(x+w/2,y+18); g.lineTo(x+w/2,y+h-18); g.stroke();
    g.beginPath(); g.moveTo(x+18,y+h/2); g.lineTo(x+w-18,y+h/2); g.stroke();
  }
  const canShowGhost = state.kanaGuide && (!state.kanaMemory || state.kanaRevealed);
  if(canShowGhost && state.selectedKana){
    g.setLineDash([]); g.globalAlpha=.12; g.fillStyle='#22223b'; g.textAlign='center'; g.textBaseline='middle'; g.font='220px "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif';
    for(let col=0; col<3; col++) for(let row=0; row<2; row++) g.fillText(state.selectedKana, (col+.5)*c.width/3, (row+.54)*c.height/2);
  }
  g.restore();
}
function initCanvas(){
  const c=$('#writeCanvas'); if(!c) return; ctx=c.getContext('2d'); drawCanvasGuide();
  ctx.lineWidth=12; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#22223b';
  const pos=e=>{ const r=c.getBoundingClientRect(); const p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}; };
  c.onpointerdown=e=>{drawing=true; c.setPointerCapture?.(e.pointerId); const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);};
  c.onpointermove=e=>{ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
  c.onpointerup=c.onpointercancel=e=>{ drawing=false; try{ c.releasePointerCapture?.(e.pointerId); }catch(_){} };
}
function clearCanvas(){ drawCanvasGuide(); }
render();
</script>
