<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d94f3d">
  <meta name="description" content="N5 Pathfinder: a fast, structured JLPT N5 study app for Japanese beginners.">
  <title>N5 Pathfinder — Fast Japanese Beginner Roadmap</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><div class="logo">N5</div><div><h1>N5 Pathfinder</h1><small>Zero → JLPT N5, deliberately</small></div></div>
    <div class="side-card">
      <div class="tiny">Overall mastery</div>
      <div class="meter" aria-label="progress"><span id="progressBar"></span></div>
      <p class="tiny" id="progressText">0 mastered items</p>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-card">
      <b>Fast daily loop</b>
      <p class="tiny">Kana/kanji 10m → vocab 15m → grammar 15m → input/shadowing 10m → quiz 10m.</p>
      <button class="btn secondary" onclick="exportProgress()">Export progress</button>
    </div>
  </aside>
  <main id="app"></main>
</div>
<button class="mobile-toggle" onclick="document.getElementById('side').classList.toggle('open')">Menu</button>
<script src="data/n5-data.js"></script>
<script src="assets/vocab/manifest.js"></script>
<script src="js/resources.js"></script>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script>
</body>
</html>
